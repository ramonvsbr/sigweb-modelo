# ── SIGWeb Caprinu: site próprio ──────────────────────────────────────────────
# Instalação (Ubuntu/Debian):
#   sudo cp deploy/nginx-sigweb.conf /etc/nginx/sites-available/sigweb
#   sudo ln -s /etc/nginx/sites-available/sigweb /etc/nginx/sites-enabled/sigweb
#   (troque "sigweb.exemplo.org" pelo seu domínio)
#   sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS (recomendado):
#   sudo certbot --nginx -d sigweb.exemplo.org
#   e depois, no .env:  DJANGO_USAR_HTTPS=True
#                       DJANGO_ALLOWED_HOSTS=sigweb.exemplo.org
#                       DJANGO_CSRF_TRUSTED_ORIGINS=https://sigweb.exemplo.org
#
# Mapa de rotas deste site:
#   /          -> frontend estático (index.html, app.js, style.css)
#   /api/      -> API FastAPI      (127.0.0.1:8000, variável API_PORT)
#   /admin/    -> painel Django    (127.0.0.1:8002, variável ADMIN_PORT)
#   /static/   -> arquivos do painel Django (CSS/JS do admin)
#   /mapas/    -> COMPATIBILIDADE com o endereço antigo (mesmo frontend)
#   /mapas/api/-> COMPATIBILIDADE: o app.js antigo chama este caminho; é repassado
#                 à API como /api/ (ver o bloco "Compatibilidade" abaixo)
# Se mudar API_PORT ou ADMIN_PORT no .env, mude as portas abaixo também.

server {
    listen 80;
    server_name sigweb.exemplo.org;

    # Frontend estático
    root /var/www/sigweb-caprinu/frontend;
    index index.html;

    # API: o caminho /api/... chega igual ao Uvicorn (sem reescrever).
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Painel de cadastro (Django)
    location /admin/ {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # CSS e JS do painel (o Django os serve em /static/). O frontend não usa
    # esse caminho: seus arquivos ficam na raiz do site.
    location /static/ {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
    }

    # ── Compatibilidade com o endereço antigo (/mapas) ───────────────────────
    # O app.js em produção busca os dados em /mapas/api/..., e o novo busca em
    # /api/.... Com os dois blocos abaixo, tanto o app.js antigo quanto o novo
    # funcionam neste servidor, então dá para trocar os arquivos sem derrubar o site.
    # Depois que ninguém mais usar /mapas, apague este trecho.
    location /mapas/api/ {
        proxy_pass http://127.0.0.1:8000/api/;   # /mapas/api/x  ->  /api/x
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /mapas {
        return 301 /mapas/;
    }

    location /mapas/ {
        alias /var/www/sigweb-caprinu/frontend/;
        try_files $uri $uri/ =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

# ── Se o /mapas antigo roda em OUTRO servidor/domínio ─────────────────────────
# (por exemplo, o do InOviSertão), esse nginx precisa continuar com o bloco
# "location /mapas/api/" apontando para a API, igual ao de cima. Enquanto ele
# existir, o app.js novo também funciona lá só se ele tiver, além disso, um
#   location /api/ { proxy_pass http://127.0.0.1:8000; ... }
# Sem isso, mantenha o app.js antigo nesse servidor até migrar para o domínio novo.
